name: Image

# main  → ghcr.io/<owner>/traefik-dashboard:edge (and sha-<commit>)
# v1.2.3 → :1.2.3, :1.2, :1 and :latest, plus a GitHub release whose notes
#          are the matching section of CHANGELOG.md
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The final stage runs `apk add` for each target platform.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=traefik-dashboard
            org.opencontainers.image.description=Live security dashboard for Traefik access logs
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v="${VERSION#v}"
          awk -v v="$v" '
            /^\[[^]]+\]: / { exit }
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No section for $v in CHANGELOG.md"
            exit 1
          fi
          # shellcheck disable=SC2016 # literal backticks (Markdown)
          printf '\n**Image**: `ghcr.io/%s:%s`\n' "$GITHUB_REPOSITORY" "$v" >> notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file notes.md "${flags[@]}"
